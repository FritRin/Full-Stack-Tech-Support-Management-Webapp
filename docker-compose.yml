services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: victoria
      POSTGRES_PASSWORD: sqlpass
      POSTGRES_DB: sportsprotechsupportdb
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victoria -d sportsprotechsupportdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./server
    ports:
      - "3000:3000"
    environment:
      PG_DB: sportsprotechsupportdb
      PG_USER: victoria
      PG_PASSWORD: sqlpass
      PG_HOST: db
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./client/build:/app/build
    depends_on:
      - app

  react-app:
    build:
      context: ./client
    ports:
      - "3001:3000"
    depends_on:
      - app